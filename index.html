let audioInited=false;
function initAudio(){
  if(audioInited) return; audioInited=true;
  try{
    if(navigator.audioSession) navigator.audioSession.type = "playback";   // iPhone: toca mesmo no modo silencioso
    const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
    actx = new AC();
    musicGain = actx.createGain(); musicGain.gain.value = 0; musicGain.connect(actx.destination);
    sfxGain = actx.createGain(); sfxGain.gain.value = SFX_VOL; sfxGain.connect(actx.destination);

}

const LAYERS = ["capa","vA","vB","loading","info"];
let zTop = 2;
function showLayer(id, withCv){
  const el = $(id);
  const prev = LAYERS.filter(x=>x!==id && $(x).classList.contains("on"));
  el.style.transition = "none"; el.style.opacity = 0; el.style.zIndex = ++zTop; el.classList.add("on");
  void el.offsetWidth;
  el.style.transition = "opacity .45s"; el.style.opacity = 1;
  cv.classList.toggle("on", !!withCv);
  clearTimeout(showLayer.t);
  showLayer.t = setTimeout(()=>{ prev.forEach(x=>{ $(x).classList.remove("on"); }); el.style.transition=""; }, 520);
}

/* espera o vídeo estar pronto antes de trocar; enquanto isso a cena anterior continua na tela */
function ready(v){
  return new Promise(res=>{
    if(v.readyState>=3) return res();
    let done=false, w=setTimeout(()=>{ show($("wait"),true); },1200);
    const fin=()=>{ if(done) return; done=true; clearTimeout(w); show($("wait"),false); res(); };
    v.addEventListener("canplay", fin, {once:true});
    v.addEventListener("loadeddata", ()=>{ if(v.readyState>=3) fin(); }, {once:true});
    setTimeout(fin, 12000);
  });
}
function preload(i){
  if(i>=FILES.length) return;

}

/* ============ boot ============ */
(function boot(){
  const bar = $("load").querySelector("i");
  let done = 0, total = 4;
  const tick = ()=>{ done++; bar.style.width = (done/total*100)+"%"; if(done>=total) setTimeout(()=>show($("load"),false),250); };
  ["capa.jpg","info.jpg","carregando.jpg"].forEach(src=>{ const i=new Image(); i.onload=i.onerror=tick; i.src=src; });
  vids[0].src = FILES[0]; vids[0].load();
  vids[0].addEventListener("canplay", tick, {once:true});
  setTimeout(()=>{ if(done<total){ done=total-1; tick(); } }, 7000);
  show($("hSubir"),true); show($("hPular"),true);
})();

function unlock(){
  if(unlocked) return; unlocked = true;
  initAudio(); startMusic();
  { const v=vids[1]; v.src = FILES[1]; v.muted=true; const p=v.play(); if(p&&p.then) p.then(()=>{ v.pause(); v.currentTime=0; v.muted=false; }).catch(()=>{ v.muted=false; }); }   // libera o 2º player (iPhone)
}

/* ============ cenas ============ */
async function goVideo(i){
  const my = ++token;
  scene = i+1;
  hideAllUI();
  const v = vids[i%2], other = vids[(i+1)%2];
  if(!v.src.endsWith(FILES[i])){ v.src = FILES[i]; v.load(); }
  v.onended = null; v.ontimeupdate = null; v.muted = false;
  await ready(v);
  if(my!==token) return;
  try{ v.currentTime = 0; }catch(e){}
  showLayer(i%2?"vB":"vA", false);
  other.pause();
  show($("skip"), true);
  preload(i+1);

  if(i===0){                          // subindo na moto
    v.play().catch(()=>{});
    v.onended = ()=>{ showLayer("loading"); hideAllUI(); const t=++token; setTimeout(()=>{ if(token===t) goVideo(1); }, 2300); };
  }
  if(i===1){                          // pilotagem: segura pra acelerar
    show($("bHold"),true); show($("prog"),true);
    const bar = $("prog").querySelector("i"), hold = $("bHold");
    const start = e=>{ e.preventDefault(); v.play().catch(()=>{}); };
    const stop  = e=>{ e.preventDefault(); v.pause(); };
    hold.onpointerdown = start; hold.onpointerup = stop; hold.onpointerleave = stop; hold.onpointercancel = stop;
    hold.oncontextmenu = e=>e.preventDefault();
    v.ontimeupdate = ()=>{ bar.style.width = (v.currentTime/v.duration*100)+"%"; if(v.currentTime>0.3) hold.style.animation="none"; };
    v.onended = ()=>goVideo(2);
  }
  if(i===2){                          // chegada na loja
    v.play().catch(()=>{});
    let shown=false;
    v.ontimeupdate = ()=>{ if(!shown && v.currentTime>=EMBLEM_AT){ shown=true; v.pause(); playEmblem(my, ()=>{ if(my===token) v.play().catch(()=>{}); }); } };
    v.onended = ()=>goVideo(3);
  }
  if(i===3){                          // totens + escanear
    show($("bScan"),true); scanning=false; ending=false;
    // capas já fixadas dentro do vídeo
    $("bScan").onclick = ()=>{ if(scanning) return; scanning=true; sfx(); show($("bScan"),false); show($("skip"),false); v.play().catch(()=>{}); };
    v.ontimeupdate = ()=>{ if(!ending && v.currentTime>=10.2){ ending=true; v.pause(); goInfo(); } };
    v.onended = ()=>{ if(!ending){ ending=true; goInfo(); } };
  }
}

function goInfo(){
  token++; scene = 5;
  hideAllUI(); stopCovers(); stopEmblem();
  showLayer("info");
  setTimeout(()=>{ vids.forEach(v=>v.pause()); }, 600);
  show($("hConf"),true); show($("hLocal"),true); show($("chipLocal"),true);
}

/* ============ emblema "MISSION PASSED" (fundo verde removido em tempo real) ============ */
const EMBLEM_AT = 4.2;     // segundo do vídeo da loja em que ele termina de descer da moto
const vE=$("vE"), em=$("em"), emx=em.getContext("2d",{willReadFrequently:true});
let emRaf=0, emSrc=null;
function stopEmblem(){
  cancelAnimationFrame(emRaf); emRaf=0; em.style.display="none"; em.style.opacity=1;
  try{ vE.pause(); }catch(e){}
  if(emSrc){ try{ emSrc.stop(); }catch(e){} emSrc=null; }
}
function playEmblem(my, done){
  let fin=false; const end=()=>{ if(fin) return; fin=true; stopEmblem(); done(); };
  try{ vE.currentTime=0; }catch(e){}
  const p=vE.play(); if(p&&p.catch) p.catch(end);
  if(actx && embBuf){ if(actx.state==="suspended") actx.resume(); emSrc=actx.createBufferSource(); emSrc.buffer=embBuf; emSrc.connect(sfxGain); emSrc.start(0); }
  em.style.display="block"; em.style.opacity=1;
  vE.onended=end; setTimeout(end, 5200);
  const loop=()=>{
    if(fin || my!==token) return;
    try{
      emx.drawImage(vE,0,0,716,242);
      const im=emx.getImageData(0,0,716,242), d=im.data;
      for(let i=0;i<d.length;i+=4){
        const r=d[i], g=d[i+1], b=d[i+2], sp=g-(r>b?r:b);
        if(sp>70){ d[i+3]=0; }
        else if(sp>22){ d[i+3]=255*(70-sp)/48; d[i+1]=(r>b?r:b); }
      }
      emx.putImageData(im,0,0);
    }catch(e){}
    const t=vE.currentTime; if(t>4.0) em.style.opacity=Math.max(0,(4.6-t)/0.6);
    emRaf=requestAnimationFrame(loop);
  };
  loop();
}

/* ============ capas passando nas telas verdes (acompanha cada quadro do vídeo) ============ */
const SW=180, SH=320, K=720/SW;
const sc=document.createElement("canvas"); sc.width=SW; sc.height=SH;
const sctx=sc.getContext("2d",{willReadFrequently:true});
const mk=document.createElement("canvas"); mk.width=SW; mk.height=SH;
const mctx=mk.getContext("2d"); const mimg=mctx.createImageData(SW,SH);
let maskFail=false;
const lab=new Int32Array(SW*SH), stack=new Int32Array(SW*SH);

function analyze(v){
  sctx.drawImage(v,0,0,SW,SH);
  const d=sctx.getImageData(0,0,SW,SH).data;
  const g=new Uint8Array(SW*SH);
  for(let i=0,p=0;p<SW*SH;p++,i+=4){ const r=d[i],gg=d[i+1],b=d[i+2]; g[p]=(gg>120&&gg>r+40&&gg>b+55)?1:0; }
  lab.fill(0);
  const keep=new Uint8Array(SW*SH), comps=[]; let id=0;
  for(let p0=0;p0<SW*SH;p0++){
    if(!g[p0]||lab[p0]) continue;
    id++; let sp=0, n=0, x0=SW,y0=SH,x1=0,y1=0, sy=0; stack[sp++]=p0; lab[p0]=id;
    const mem=[];
    while(sp){
      const p=stack[--sp]; mem.push(p); n++;
      const x=p%SW, y=(p/SW)|0; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; sy+=y;
      if(x>0&&g[p-1]&&!lab[p-1]){lab[p-1]=id;stack[sp++]=p-1;}
      if(x<SW-1&&g[p+1]&&!lab[p+1]){lab[p+1]=id;stack[sp++]=p+1;}
      if(y>0&&g[p-SW]&&!lab[p-SW]){lab[p-SW]=id;stack[sp++]=p-SW;}
      if(y<SH-1&&g[p+SW]&&!lab[p+SW]){lab[p+SW]=id;stack[sp++]=p+SW;}
    }
    const w=x1-x0+1, h=y1-y0+1, cy=sy/n;
    // ignora pontinhos, reflexos no chão e formas que não são tela
    if(n>=10 && n/(w*h)>0.3 && cy<SH*0.74){ comps.push([x0,y0,x1+1,y1+1]); for(const p of mem) keep[p]=1; }
  }
  // dilata 1px para cobrir a borda esverdeada
  const out=mimg.data;
  for(let y=0;y<SH;y++)for(let x=0;x<SW;x++){
    const p=y*SW+x; let on=keep[p];
    if(!on){ if((x>0&&keep[p-1])||(x<SW-1&&keep[p+1])||(y>0&&keep[p-SW])||(y<SH-1&&keep[p+SW])) on=1; }
    const q=p*4; out[q]=out[q+1]=out[q+2]=255; out[q+3]=on?255:0;
  }
  mctx.putImageData(mimg,0,0);
  return comps;
}

function startCovers(v){
  stopCovers();
  const loop = ()=>{
    ctx.globalCompositeOperation="source-over";
    ctx.clearRect(0,0,720,1280);
    const now = performance.now();
    let comps=null;
    if(!maskFail){ try{ comps=analyze(v); }catch(e){ maskFail=true; } }
    if(comps){
      comps.forEach((b,k)=>{
        const x=(b[0]-1)*K, y=(b[1]-1)*K, w=(b[2]-b[0]+2)*K, h=(b[3]-b[1]+2)*K;
        drawTile(x,y,w,h,k,now);
      });
      ctx.globalCompositeOperation="destination-in";
      ctx.imageSmoothingEnabled=true;
      ctx.drawImage(mk,0,0,720,1280);
      ctx.globalCompositeOperation="source-over";
    } else if(maskFail){                       // plano B: caixas pré-calculadas
      const fi = Math.min(BOXES.length-1, Math.max(0, Math.round(v.currentTime*24)));
      (BOXES[fi]||[]).forEach((b,k)=>{
        ctx.save(); ctx.beginPath(); ctx.rect(b[0]-2,b[1]-2,b[2]-b[0]+4,b[3]-b[1]+4); ctx.clip();
        drawTile(b[0]-2,b[1]-2,b[2]-b[0]+4,b[3]-b[1]+4,k,now); ctx.restore();
      });
    }
    rafId = requestAnimationFrame(loop);
  };
  loop();
}
function drawTile(x,y,w,h,k,now){
  const idx = Math.floor((now/1500)+k) % coverImgs.length;
  const nxt = (idx+1) % coverImgs.length;
  const ph = (now/1500 + k) % 1;
  drawCover(coverImgs[idx], x,y,w,h, 1);
  if(ph>0.8) drawCover(coverImgs[nxt], x,y,w,h, (ph-0.8)/0.2);
}
function drawCover(img,x,y,w,h,alpha){
  if(!img.complete||!img.naturalWidth) return;
  const s = Math.max(w/img.naturalWidth, h/img.naturalHeight);
  const iw=img.naturalWidth*s, ih=img.naturalHeight*s;
  ctx.globalAlpha=alpha; ctx.drawImage(img, x+(w-iw)/2, y+(h-ih)/2, iw, ih); ctx.globalAlpha=1;
}
function stopCovers(){ cancelAnimationFrame(rafId); ctx.clearRect(0,0,720,1280); }

/* ============ botões ============ */
$("hSubir").onclick = ()=>{ unlock(); sfx(); goVideo(0); };
$("hPular").onclick = ()=>{ unlock(); sfx(); vids.forEach(v=>v.pause()); goInfo(); };
$("skip").onclick   = ()=>{ unlock(); sfx(); vids.forEach(v=>v.pause()); goInfo(); };
$("hConf").onclick = ()=>{
  sfx();
  const a = $("goWpp");
  a.href = CONFIG.whatsapp ? "https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent(CONFIG.mensagem) : "#";
  $("modal").style.display = "flex";
};
$("goWpp").onclick = e=>{
  sfx();
  if(!CONFIG.whatsapp){ e.preventDefault(); $("modal").style.display="none"; toast("Versão de teste: o WhatsApp ainda não foi configurado."); return; }
  setTimeout(()=>{ $("modal").style.display="none"; }, 400);
};
$("backWpp").onclick = ()=>{ sfx(); $("modal").style.display="none"; };
$("hLocal").onclick = ()=>{
  sfx();
  if(!CONFIG.endereco){ toast("Versão de teste: o endereço ainda não foi configurado."); return; }
  window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(CONFIG.endereco), "_blank");
};
